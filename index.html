
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Riddle Master</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🧠 Riddle Master</h1>
    <p>Explore and solve fun riddles!</p>
  </header>

  <main>

    <!-- Filter -->
    <select id="filterSelect">
      <option value="all">All</option>
      <option value="short">Short</option>
      <option value="long">Long</option>
      <option value="easy">Easy</option>
      <option value="hard">Hard</option>
    </select>

    <!-- Dark Mode -->
    <button id="toggleTheme">Toggle Dark/Light Mode</button>

    <div id="loading">Loading riddles...</div>

    <button id="nextRiddle">Next Riddle</button>

    <div id="riddleContainer"></div>

  </main>

  <footer>
    <p>Built using JavaScript and a public Riddle API</p>
  </footer>

  <script src="script.js" defer></script>

</body>
</html>
